<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hikkonuki social preview</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    :lang(ja) {
      font-family: "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", system-ui, sans-serif;
    }

    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      display: grid;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 89% 42%, #d9f0e8 0%, transparent 58%),
        linear-gradient(120deg, #f9fdfb, #eef8f4 68%, #e5f4ee);
      color: #143934;
    }

    .copy {
      position: relative;
      z-index: 1;
      width: 690px;
      padding-left: 78px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 31px;
      font-weight: 650;
      letter-spacing: -.035em;
    }

    .brand img {
      width: 58px;
      height: 58px;
      border-radius: 15px;
    }

    h1 {
      margin: 47px 0 26px;
      font-size: 74px;
      font-weight: 750;
      letter-spacing: -.048em;
      line-height: 1.05;
    }

    h1 span { display: block; }
    h1 span:last-child { color: #0b6e69; }

    .description {
      max-width: 520px;
      margin: 0;
      color: #42635d;
      font-size: 25px;
      font-weight: 500;
      line-height: 1.45;
      text-wrap: pretty;
    }

    html[lang="ja"] h1 {
      font-size: 69px;
      letter-spacing: -.045em;
      line-height: 1.18;
    }

    .scene {
      position: absolute;
      inset: 0 30px 0 620px;
      --cable: #588981;
      --plug: linear-gradient(110deg, #385250, #243b3a);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 38px -114px 38px 48px;
      border: 1px solid #b1d8cf;
      border-radius: 50%;
      box-shadow: 0 0 0 38px rgb(97 166 153 / 8%), 0 0 0 77px rgb(97 166 153 / 4%);
    }

    .cable-drop, .cable-loop { position: absolute; border: solid var(--cable); }

    .cable-drop {
      top: 337px;
      left: 243px;
      width: 30px;
      height: 190px;
      border-width: 7px 7px 0 0;
      border-top-right-radius: 24px;
    }

    .cable-loop {
      top: 522px;
      left: 266px;
      right: 169px;
      height: 54px;
      border-width: 0 7px 7px;
      border-radius: 0 0 26px 26px;
    }

    .action-camera {
      position: absolute;
      top: 255px;
      left: 38px;
      width: 181px;
      height: 123px;
      border: 1px solid #55706e;
      border-radius: 22px;
      background: linear-gradient(145deg, #466462, #283c3c 62%, #152827);
      box-shadow: 0 6px 0 #192f2e, 0 15px 27px #2857523b, inset 0 2px #ffffff1f;
    }

    .action-camera::before, .action-camera::after, .phone::after {
      content: "";
      position: absolute;
      border: 1px solid #567571;
      background: var(--plug);
    }

    .action-camera::before {
      top: -9px;
      left: 21px;
      width: 35px;
      height: 8px;
      border-radius: 5px 5px 1px 1px;
    }

    .action-camera::after {
      top: 72px;
      right: -26px;
      width: 25px;
      height: 25px;
      border-radius: 2px 5px 5px 2px;
    }

    .camera-display {
      position: absolute;
      top: 31px;
      left: 15px;
      width: 56px;
      height: 55px;
      overflow: hidden;
      border: 4px solid #172a29;
      border-radius: 8px;
      background: linear-gradient(#acd8d9, #6ba8a1 65%);
    }

    .camera-display::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #356762;
      clip-path: polygon(0 100%, 0 68%, 24% 42%, 44% 65%, 75% 28%, 100% 59%, 100% 100%);
    }

    .camera-lens {
      position: absolute;
      top: 14px;
      right: 15px;
      width: 91px;
      height: 91px;
      border: 4px solid #1b2c2d;
      border-radius: 50%;
      background: radial-gradient(circle,
        #27474c 0 12%, #15262c 13% 32%, #477575 34%, #1b3137 39% 47%,
        #0f2022 50% 56%, #4e6665 57% 59%, #263a3e 61%);
      box-shadow: inset 0 0 0 1px #ffffff22, 0 2px 4px #0f2022a3;
    }

    .camera-lens::after {
      content: "";
      position: absolute;
      inset: 23px 27px 32px 23px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 35% 28%, #80d2cfb0, transparent 65%);
    }

    .phone {
      position: absolute;
      bottom: 106px;
      right: 67px;
      width: 209px;
      margin: 0;
      padding: 8px;
      border: 1px solid #7a9e97;
      border-radius: 32px;
      background: #081a1a;
      box-shadow: 0 15px 37px #2857524a, 0 0 0 1px #051516;
      transform: rotate(7deg);
      transform-origin: center bottom;
    }

    .phone::after {
      bottom: -22px;
      left: 50%;
      width: 22px;
      height: 22px;
      border-radius: 2px 2px 5px 5px;
      transform: translateX(-50%);
    }

    .phone img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 24px;
      background: #edf2f5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="copy">
      <div class="brand"><img src="../public/app-icon-512.png" alt="">Hikkonuki</div>
      <h1><span>Import over USB.</span><span>Share at 2K.</span></h1>
      <p class="description">Camera photos and videos, straight to Android.</p>
    </div>
    <div class="scene">
      <div class="cable-drop" aria-hidden="true"></div>
      <div class="cable-loop" aria-hidden="true"></div>
      <div class="action-camera" aria-hidden="true">
        <div class="camera-display"></div>
        <div class="camera-lens"></div>
      </div>
      <figure class="phone">
        <img src="../public/shots/en/08_selection.webp" width="1080" height="2400"
          alt="Hikkonuki open on a phone connected to an action camera by USB">
      </figure>
    </div>
  </main>
  <script>
    if (new URLSearchParams(location.search).get("lang") === "ja") {
      document.documentElement.lang = "ja";
      const [first, second] = document.querySelectorAll("h1 span");
      first.textContent = "USBで取り込み、";
      second.textContent = "2Kでシェア。";
      document.querySelector(".description").textContent = "カメラの写真・動画をAndroidへ。";
      const screenshot = document.querySelector(".phone img");
      screenshot.src = "../public/shots/ja/08_selection.webp";
      screenshot.alt = "USBでアクションカメラと接続し、Hikkonukiを開いたスマートフォン";
    }
  </script>
</body>
</html>
